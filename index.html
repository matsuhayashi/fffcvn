<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Fantasy Fan Club VN</title>
	
	<link rel="icon" type="image/png" href="Logo_01.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS Reset & Biến màu sắc cho Giao diện Sáng (Light Theme) */
        :root {
            --text-color: #111111;              /* Màu chữ chủ đạo (Đen xám) */
            --border-color: rgba(0, 0, 0, 0.1);  /* Viền mờ màu đen */
            --hover-bg: #111111;                /* Nền khi di chuột vào (Đen) */
            --hover-text: #ffffff;              /* Chữ khi di chuột vào (Trắng) */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            
            /* --- HÌNH NỀN SÁNG TOÀN TRANG --- */
            background-image: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), url('image_0.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Header / Phần Logo */
        .header {
            text-align: center;
            margin-bottom: 50px;
            padding: 0 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CSS tùy chỉnh cho hình ảnh Logo */
        .logo {
            width: 100%;
            max-width: 500px; /* Giới hạn độ rộng tối đa để logo không bị quá to trên màn hình máy tính */
            height: auto;
            margin-bottom: 15px;
            /* Phủ thêm một chút bóng mờ để logo nổi bật hơn trên nền */
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.05));
        }

        .header p {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 4px;
            color: #555555;
            text-transform: uppercase;
        }

        /* Container chứa các links */
        .links-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            width: 100%;
            max-width: 700px;
            padding: 0 20px;
            z-index: 10;
        }

        /* Thiết kế từng khối link (Hiệu ứng Kính mờ trên nền sáng) */
        .link-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .link-card i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            transition: transform 0.4s ease;
        }

        .link-card span {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Hiệu ứng Hover chuyển sang tối giản Đen tuyền */
        .link-card:hover {
            background-color: var(--hover-bg);
            color: var(--hover-text);
            border-color: var(--hover-bg);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            transform: translateY(-5px);
        }

        .link-card:hover i {
            transform: scale(1.15);
        }

        /* Footer */
        .footer {
            margin-top: 60px;
            font-size: 0.8rem;
            color: #666666;
            letter-spacing: 1px;
            text-align: center;
            z-index: 10;
        }

        /* Responsive cho điện thoại */
        @media (max-width: 600px) {
            .logo {
                max-width: 300px; /* Thu nhỏ logo lại khi xem trên điện thoại */
            }
            .links-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .link-card {
                padding: 25px 20px;
                flex-direction: row;
                justify-content: flex-start;
            }
            .link-card i {
                margin-bottom: 0;
                margin-right: 20px;
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <img src="image_88d561.png" alt="Final Fantasy Logo" class="logo">
        <p>Fan Club VN</p>
    </header>

    <main class="links-container">
        <a href="https://www.facebook.com/finalfantasyfcvn" class="link-card">
            <i class="fa-brands fa-facebook-f"></i>
            <span>Blog</span>
        </a>

        <a href="https://f.gvn.co/forums/final-fantasy-fan-club.13/" class="link-card">
            <i class="fa-solid fa-gamepad"></i>
            <span>Forum</span>
        </a>

        <a href="https://docs.google.com/document/d/1b1ohBAPz0YASSe4vDnujf40nYvLUF_92I9kCkoaZIFQ/edit?usp=sharing" class="link-card">
            <i class="fa-solid fa-book-journal-whills"></i>
            <span>Codex Crystallis</span>
        </a>

        <a href="https://www.youtube.com/@FFFCVN" class="link-card">
            <i class="fa-brands fa-youtube"></i>
            <span>YouTube</span>
        </a>
    </main>

    <footer class="footer">
        <p>The Crystal Protects. © <span id="currentYear"></span></p>
		<p>FFFCVN.NET</p>
    </footer>

    <script>
        document.getElementById("currentYear").textContent = new Date().getFullYear();
    </script>

</body>
</html>
